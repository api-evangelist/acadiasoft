conformance:
- id: isda-simm
  name: ISDA SIMM (Standard Initial Margin Model) v2.5
  category: domain-standard
  market: uncleared OTC derivatives / initial margin
  conforms: true
  evidence: https://github.com/AcadiaSoft/simm-lib/blob/master/README.md
  detail: 'simm-lib is a first-party implementation of SIMM 2.5 and all previous versions.
    The README records that the library passes ISDA''s own one-day AND ten-day benchmark
    suites for v2.5 across multiple applicable regulations in both Segregated and
    Unsegregated modes — i.e. conformance is demonstrated against the standards body''s
    published test vectors, not merely claimed in prose. The `simm` and `simm-ple`
    Maven modules are the shipped conformance surface.'
  caveat: This is conformance of a published LIBRARY to the standard. It is not a
    conformance statement about an API contract, because Acadia publishes no API contract.
- id: isda-crif
  name: ISDA CRIF (Common Risk Interchange Format)
  category: domain-standard
  market: uncleared OTC derivatives / risk sensitivity interchange
  conforms: true
  evidence: https://github.com/AcadiaSoft/simm-lib/blob/master/README.md
  detail: 'The library''s entire public input surface is CRIF-shaped. The README documents
    the CRIF record types it consumes verbatim — Sensitivity(productClass, riskType,
    qualifier, bucket, label1, label2, amount, amountCurrency, amountUsd),
    AddOnNotional, AddOnFixedAmount, AddOnNotionalFactor, ProductMultiplier,
    ScheduleNotional, SchedulePv — and the `Crif` supertype is described as intended
    to "directly translate a standard CRIF file into a List<Crif>". Column semantics
    (amountCurrency / amountUSD, postRegulation / collectRegulation) match the CRIF
    specification. This is the strongest domain-standard signature on the record.'
