  name: ISDA Schedule (grid) initial margin method
  category: domain-standard
  market: uncleared OTC derivatives / initial margin
  conforms: true
  evidence: https://github.com/AcadiaSoft/simm-lib/tree/master/schedule
  detail: The `schedule` module implements the ISDA Schedule/grid method as an alternative
    to SIMM, netting trade-level notionals and PVs and computing the net gross ratio.
