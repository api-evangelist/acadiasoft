domain_standards_summary: 'Acadia''s market — uncleared OTC derivatives margining — has
  a real interchange standard (ISDA CRIF) and a real model standard (ISDA SIMM), and
  Acadia ships a benchmark-passing open implementation of both. A counterparty that
  already speaks CRIF can hand Acadia''s library a standard CRIF file with no bespoke
  connector. What is missing is the same standards posture expressed as a callable
  contract: none of it is reachable over an API a non-customer can describe.'
