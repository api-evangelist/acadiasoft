aid: acadiasoft
name: Acadia
description: 'Acadia, founded in 2009 as AcadiaSoft, provides risk, margin and collateral management
  services to the global uncleared OTC derivatives market and now operates as part of LSEG Post Trade
  following LSEG''s December 2022 acquisition. Its AcadiaPlus platform — Agreement Manager, Margin
  Manager, Collateral Manager, IM Exposure Manager, Payments Manager, Settlement Manager and Relay,
  alongside the Risk Suite analytics services — connects more than 2,000 market participants for
  initial-margin calculation, margin-call messaging, reconciliation, dispute resolution and settlement.
  Acadia''s own factsheets state its applications are reachable by web user interface, direct API
  and SFTP, but that interface is delivered under customer contract: the product documentation portal
  is authenticated and no public specification is published. The company''s one public machine-readable
  artifact is simm-lib, an MIT-licensed Java implementation of the ISDA SIMM initial-margin model.'
